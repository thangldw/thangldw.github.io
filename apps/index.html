  <meta property="og:description" content="Practical engineering systems, games, and learning programs, shared for feedback, collaboration, and continued learning.">
  <meta property="og:url" content="https://thangldw.github.io/apps/">
  <meta property="og:image" content="https://thangldw.github.io/assets/social-apps.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/icons.css?v=20260714">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css?v=20260725f">
  <link rel="stylesheet" href="/css/project-title-link.css?v=20260727a">

<body class="site-page portfolio-catalog" data-page-kind="product" data-site-shell="none">
  <a class="skip-link" href="#catalog">Skip to projects</a>

  <main class="apps-hub apps-main" id="main">
    <header class="apps-topbar">
      <span class="apps-brand">APP LIBRARY</span>
      <div class="apps-header-actions">
        <a class="apps-home-link" href="/">Back to portfolio</a>
        <button type="button" class="site-theme-toggle" id="themeToggle" aria-label="Switch to dark theme"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
      </div>
    </header>

    <section class="apps-hero" aria-labelledby="appsTitle">
      <span class="eyebrow">MADE BY THANG LUU</span>
      <h1 id="appsTitle">Tools for work, learning<br>and a little play.</h1>
      <p class="lead">Small tools and independent projects. Find something useful, explore how it works, or try it out.</p>
    </section>

    <section class="apps-browse" aria-label="Find a project">
      <label class="apps-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span class="sr-only">Search apps and projects</span>
        <input id="projectSearch" type="search" placeholder="Find an app, topic, or tool…" disabled>
      </label>
      <nav class="apps-group-nav" aria-label="Browse project groups">
        <button type="button" data-group="all" aria-pressed="true" disabled>All</button>
        <button type="button" data-group="engineering" aria-pressed="false" disabled>Engineering</button>
        <button type="button" data-group="utilities" aria-pressed="false" disabled>Utilities</button>
        <button type="button" data-group="learning" aria-pressed="false" disabled>Learning</button>
        <button type="button" data-group="experiments" aria-pressed="false" disabled>Experiments</button>
      </nav>
    </section>

    <section class="apps-projects" id="catalog" aria-labelledby="projectLibraryHeading">
      <div class="apps-project-heading">
        <h2 class="sr-only" id="projectLibraryHeading">Project library</h2>
        <span id="projectCount" role="status" aria-live="polite">Loading projects</span>
      </div>
      <div class="apps-project-grid" id="projectIndex" aria-label="Project library grouped by purpose, with engineering projects first"></div>
      <div class="catalog-empty" id="catalogEmpty" hidden>
        <h2>Projects are unavailable</h2>
        <p>Please try again shortly.</p>
      </div>
    </section>
  </main>

  <script src="/js/projects-data.js?v=json-v2"></script>
  <script src="/js/apps-catalog.js?v=20261005a"></script>
</body>
</html>
